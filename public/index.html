<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anchor Catenary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Anchor catenary</h1>
    <span id="badge" class="badge">–</span>
    <span class="spacer"></span>
    <label class="small">Vertical ×
      <select id="exaggerate">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="4">4</option>
      </select>
    </label>
    <button id="night" class="ghost" title="Red night mode">Night</button>
  </header>

  <main>
    <section class="panel wide">
      <h2>Side view <span class="small muted">anchor left, bow right</span></h2>
      <svg id="side" viewBox="0 0 1000 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Rode profile from anchor to bow"></svg>
      <div id="legend" class="legend small"></div>
      <div id="missing" class="missing" hidden></div>
    </section>

    <section class="panel">
      <h2>Rode</h2>
      <dl class="stats" id="stats"></dl>
    </section>

    <section class="panel">
      <h2>Plan view <span class="small muted">north up</span></h2>
      <svg id="plan" viewBox="0 0 400 400" role="img" aria-label="Boat and anchor seen from above"></svg>
    </section>

    <section class="panel">
      <h2>Inputs</h2>
      <dl class="stats" id="inputs"></dl>
      <form id="rodeForm" class="row">
        <label for="rode">Rode out (m)</label>
        <input id="rode" type="number" step="1" min="0" inputmode="decimal">
        <button type="submit">Set</button>
        <button type="button" class="ghost" id="rodeClear">Clear</button>
      </form>
      <p class="small muted" id="rodeNote"></p>
      <form id="seabedForm" class="row">
        <label for="seabed">Charted depth at anchor (m)</label>
        <input id="seabed" type="number" step="0.1" inputmode="decimal">
        <button type="submit">Set</button>
        <button type="button" class="ghost" id="seabedClear">Clear</button>
      </form>
      <p class="small muted">Used when the plugin's depth setting is “charted depth”. The tide is added to it.</p>
      <form id="snubberForm" class="row" hidden>
        <label for="loop">Chain let out after hooking the snubber on (m)</label>
        <input id="loop" type="number" step="0.5" min="0" inputmode="decimal">
        <button type="submit">Hook on</button>
        <button type="button" class="ghost" id="snubberOff">Off</button>
      </form>
      <p class="small muted" id="snubberNote"></p>
      <div class="row">
        <button type="button" id="record">Use depth here as depth at anchor</button>
      </div>
      <p class="small muted">Takes the sounder depth and tide now as the depth at the anchor. Use it when the boat is over the anchor.</p>
      <p class="error" id="error" hidden></p>
    </section>
  </main>

  <script src="bus.js"></script>
  <script src="app.js"></script>
</body>
</html>
